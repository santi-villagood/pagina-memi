<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script></head>
<body>
<header><div class="wrap" style="padding:0"><h1>Panel</h1><p>Acá cargás y editás tus piezas.</p></div></header>
<div class="wrap">
<form class="f" id="login"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Contraseña<input id="pw" type="password" required autocomplete="current-password"></label><button class="btn">Entrar</button></form>
<div id="panel" hidden>
<form class="f" id="form">
<h2 id="ft" style="margin:0">Nueva pieza</h2>
<label>Nombre<input id="ti" required></label>
<label>Descripción<textarea id="de" rows="3"></textarea></label>
<label>Categoría<input id="ca" list="cats" required placeholder="Ej: Decoración"></label><datalist id="cats"></datalist>
<label>Precio en dólares (USD)<input id="pu" type="number" min="0" step="0.01" required inputmode="decimal"></label>
<label>Foto<input id="fo" type="file" accept="image/*"></label>
<button class="btn" id="save">Guardar pieza</button><button type="button" class="btn alt" id="cancel" hidden>Cancelar edición</button>
<p class="msg" id="msg" role="status"></p>
</form>
<form class="f" id="rf"><label>Cotización manual (pesos por dólar), se usa solo si falla la consulta automática<input id="rt" type="number" min="1" step="0.01" inputmode="decimal"></label><button class="btn alt">Guardar cotización</button></form>
<h2>Mis piezas</h2><div id="list"></div>
<button class="btn alt" id="out" style="margin-top:1rem">Salir</button>
</div></div>
<script>
const db=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s);
let list=[],editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=t=>$('#msg').textContent=t;
function show(on){$('#login').hidden=on;$('#panel').hidden=!on;if(on)load()}
db.auth.getSession().then(({data})=>show(!!data.session));
$('#login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)alert('Email o contraseña incorrectos.');else show(true)};
$('#out').onclick=async()=>{await db.auth.signOut();show(false)};
async function load(){
  const {data}=await db.from('products').select('*').order('created_at',{ascending:false});list=data||[];
  $('#cats').innerHTML=[...new Set(list.map(p=>p.category))].map(c=>`<option value="${esc(c)}">`).join('');
  $('#list').innerHTML=list.map(p=>`<div class="row"><span><b>${esc(p.title)}</b><br><small>${esc(p.category)} · USD ${p.price_usd}</small></span><span><button class="btn alt" data-e="${p.id}">Editar</button> <button class="btn del" data-d="${p.id}">Borrar</button></span></div>`).join('')||'<p>Todavía no cargaste piezas.</p>';
  const {data:s}=await db.from('settings').select('value').eq('key','manual_rate').maybeSingle();$('#rt').value=s?s.value:''}
function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1200/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.82)};i.src=URL.createObjectURL(f)})}
function reset(){editing=null;$('#form').reset();$('#ft').textContent='Nueva pieza';$('#cancel').hidden=true}
$('#cancel').onclick=reset;
$('#form').onsubmit=async e=>{e.preventDefault();
  const f=$('#fo').files[0];if(!f&&!editing){msg('Elegí una foto.');return}
  $('#save').disabled=true;msg('Guardando...');
  const row={title:$('#ti').value.trim(),description:$('#de').value.trim(),category:$('#ca').value.trim(),price_usd:+$('#pu').value};
  if(f){const path=Date.now()+'.jpg',{error:ue}=await db.storage.from('fotos').upload(path,await shrink(f),{contentType:'image/jpeg'});
    if(ue){msg('No se pudo subir la foto: '+ue.message);$('#save').disabled=false;return}
    row.photo_url=db.storage.from('fotos').getPublicUrl(path).data.publicUrl}
  const {error}=editing?await db.from('products').update(row).eq('id',editing):await db.from('products').insert(row);
  $('#save').disabled=false;
  if(error){msg('No se pudo guardar: '+error.message);return}
  msg('Pieza guardada.');reset();load()};
$('#rf').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('settings').upsert({key:'manual_rate',value:String($('#rt').value)});msg(error?'No se pudo guardar la cotización.':'Cotización guardada.')};
$('#list').onclick=async e=>{const t=e.target;
  if(t.dataset.e){const p=list.find(x=>x.id===t.dataset.e);editing=p.id;$('#ti').value=p.title;$('#de').value=p.description||'';$('#ca').value=p.category;$('#pu').value=p.price_usd;$('#ft').textContent='Editando: '+p.title;$('#cancel').hidden=false;scrollTo(0,0)}
  if(t.dataset.d&&confirm('¿Borrar esta pieza?')){await db.from('products').delete().eq('id',t.dataset.d);load()}};
</script></body></html>
