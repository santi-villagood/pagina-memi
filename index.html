<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impresiones 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script></head>
<body>
<header><div class="wrap" style="padding:0"><h1 id="t"><img src="logo.png" alt="Memi Atelier 3D"></h1><p>Diseños personalizados hechos para vos.<br>Elegí lo que más te guste, armá tu pedido y mandalo por WhatsApp.</p></div></header>
<main>
<div class="chips" id="chips" role="group" aria-label="Categorías"></div>
<div class="grid" id="grid"><p>Cargando piezas...</p></div>
<p class="note" id="note"></p>
</main>
<button id="cartbtn" aria-label="Mi pedido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6"/></svg><span id="cc" hidden>0</span></button>
<dialog id="dd"></dialog>
<dialog id="cd"></dialog>
<script>
const db=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s);
let items=[],cat='Todo',rate=0,cart={},memo='';
try{const s=JSON.parse(localStorage.getItem('memi-cart')||'{}');cart=s.cart||{};memo=s.memo||''}catch(e){}
document.title=CFG.store;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ars=n=>'$'+Math.round(n).toLocaleString('es-AR');
const fm=n=>'$'+Math.round(n).toLocaleString('es-AR');
const ARS=p=>p.price_ars!=null?+p.price_ars:Math.round(p.price_usd*rate/100)*100;
const pr=p=>`<span class="ars">${fm(ARS(p))}</span><span class="usd">USD ${(+p.price_usd).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`;
function save(){try{localStorage.setItem('memi-cart',JSON.stringify({cart,memo}))}catch(e){}}
async function getRate(){
  try{const j=await (await fetch('https://dolarapi.com/v1/dolares/blue')).json();if(j.venta)return +j.venta}catch(e){}
  const {data}=await db.from('settings').select('value').eq('key','manual_rate').maybeSingle();
  return data?+data.value:0}
async function init(){
  const [r,{data,error}]=await Promise.all([getRate(),db.from('products').select('*').order('created_at',{ascending:false})]);
  rate=r;items=data||[];
  if(error){$('#grid').innerHTML='<p>No se pudieron cargar las piezas. Detalle: '+esc(error.message)+'</p>';return}
  for(const k of Object.keys(cart))if(!items.some(p=>p.id===k))delete cart[k];
  $('#note').textContent='Precios en pesos argentinos. Se confirman al hacer el pedido.';
  render()}
function render(){
  const cats=['Todo',...new Set(items.flatMap(p=>p.categories))];
  $('#chips').innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const list=items.filter(p=>cat==='Todo'||p.categories.includes(cat));
  $('#grid').innerHTML=list.length?list.map(p=>`<article class="card" tabindex="0" data-id="${p.id}"><img loading="lazy" src="${esc(p.photos[0])}" alt="${esc(p.title)}"><div class="b"><h3>${esc(p.title)}</h3><span class="tag">${esc(p.categories.join(' · '))}</span><p class="pr">${pr(p)}</p><button class="btn" data-add="${p.id}">Agregar</button></div></article>`).join(''):'<p>Todavía no hay piezas en esta categoría.</p>';
  count()}
function count(){const n=Object.values(cart).reduce((a,b)=>a+Math.max(b,0),0);$('#cc').textContent=n;$('#cc').hidden=!n;save()}
function add(id){cart[id]=(cart[id]||0)+1;count();const b=$('#cartbtn');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
function detail(id){const p=items.find(x=>x.id===id);
  $('#dd').innerHTML=`<img id="big" src="${esc(p.photos[0])}" alt="${esc(p.title)}">${p.photos.length>1?'<div class="th">'+p.photos.map(u=>`<img src="${esc(u)}" data-big="${esc(u)}" alt="Foto de ${esc(p.title)}">`).join('')+'</div>':''}<h2>${esc(p.title)}</h2><span class="tag">${esc(p.categories.join(' · '))}</span><p style="white-space:pre-line">${esc(p.description)}</p><p class="pr">${pr(p)}</p><button class="btn" data-add="${p.id}">Agregar al pedido</button> <button class="btn alt" data-close="1">Cerrar</button>`;
  $('#dd').showModal()}
function cartView(){
  const ids=Object.keys(cart).filter(i=>cart[i]>0),tot=ids.reduce((a,i)=>a+cart[i]*ARS(items.find(p=>p.id===i)),0);
  $('#cd').innerHTML=`<h2>Mi pedido</h2>`+(ids.length?ids.map(i=>{const p=items.find(x=>x.id===i);return `<div class="row"><span>${esc(p.title)}<br><small>${fm(ARS(p))} c/u</small></span><span class="q"><button data-m="${i}" aria-label="Quitar uno">-</button> ${cart[i]} <button data-p="${i}" aria-label="Agregar uno">+</button></span></div>`}).join('')+`<label>Detalles de tu pedido (opcional)<textarea id="nt" rows="3" placeholder="Ej: nombre para el cuadro, colores, tamaño...">${esc(memo)}</textarea></label><p class="pr">Total: ${fm(tot)}</p><button class="btn" data-send="1">Enviar pedido por WhatsApp</button> `:'<p>Todavía no agregaste nada. Tocá "Agregar" en las piezas que te gusten.</p>')+`<button class="btn alt" data-close="1">Cerrar</button>`;
  if(!$('#cd').open)$('#cd').showModal()}
function send(){
  const ids=Object.keys(cart).filter(i=>cart[i]>0);let tot=0;
  const lines=ids.map(i=>{const p=items.find(x=>x.id===i);tot+=cart[i]*ARS(p);return `- ${cart[i]} x ${p.title} (${fm(ARS(p))})`});
  const msg=`Hola! Quiero hacer este pedido:\n${lines.join('\n')}\nTotal: ${fm(tot)}${memo.trim()?`\nDetalles: ${memo.trim()}`:''}\nGracias!`;
  window.open(`https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank')}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.big)$('#big').src=t.dataset.big;
  else if(t.dataset.c){cat=t.dataset.c;render()}
  else if(t.dataset.add){add(t.dataset.add);if($('#cd').open)cartView()}
  else if(t.dataset.p){add(t.dataset.p);cartView()}
  else if(t.dataset.m){cart[t.dataset.m]--;count();cartView()}
  else if(t.dataset.send)send();
  else if(t.dataset.close)t.closest('dialog').close();
  else if(t.closest('#cartbtn'))cartView();
  else if(t.closest('.card'))detail(t.closest('.card').dataset.id)});
document.addEventListener('input',e=>{if(e.target.id==='nt'){memo=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))detail(e.target.dataset.id)});
init();
</script></body></html>
